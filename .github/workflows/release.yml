name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Release Tag
        run: |
          expected_tag="v$(bun -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" != "refs/tags/$expected_tag" ]]; then
            echo "::error::Run this workflow on tag $expected_tag. Received $GITHUB_REF."
            exit 1
          fi

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Type Check
        run: bun run typecheck

      - name: Build Package and Explorer
        run: bun run build

      - name: Run Test Suite
        run: bun test

      - name: Compile Standalone Binaries
        run: bun run scripts/compile.ts

      - name: Smoke Test Linux x64 Release Binary
        run: bun scripts/smoke-release.ts "$GITHUB_WORKSPACE/dist/strata-linux-x64"

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum strata-* > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/strata-linux-x64
            dist/strata-linux-arm64
            dist/strata-darwin-x64
            dist/strata-darwin-arm64
            dist/strata-windows-x64.exe
            dist/checksums.txt
            scripts/install.sh
            scripts/install.ps1
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
