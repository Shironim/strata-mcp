name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Test Suite
        run: bun test

      - name: Compile Standalone Binaries
        run: |
          mkdir -p dist
          echo "Compiling Linux x64..."
          bun build ./bin/strata.ts --compile --target=bun-linux-x64 --outfile dist/strata-linux-x64
          echo "Compiling Linux ARM64..."
          bun build ./bin/strata.ts --compile --target=bun-linux-arm64 --outfile dist/strata-linux-arm64
          echo "Compiling macOS x64..."
          bun build ./bin/strata.ts --compile --target=bun-darwin-x64 --outfile dist/strata-darwin-x64
          echo "Compiling macOS ARM64 (Apple Silicon)..."
          bun build ./bin/strata.ts --compile --target=bun-darwin-arm64 --outfile dist/strata-darwin-arm64
          echo "Compiling Windows x64..."
          bun build ./bin/strata.ts --compile --target=bun-windows-x64 --outfile dist/strata-windows-x64.exe

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum strata-* > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/strata-linux-x64
            dist/strata-linux-arm64
            dist/strata-darwin-x64
            dist/strata-darwin-arm64
            dist/strata-windows-x64.exe
            dist/checksums.txt
            scripts/install.sh
            scripts/install.ps1
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
