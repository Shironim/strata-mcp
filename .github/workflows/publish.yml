name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Enables manual "Run workflow" button in GitHub Actions UI

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

      - name: Run test suite
        run: bun test

  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write # Required for OIDC trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org' # Needed for OIDC trusted publishing

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build distribution
        run: bun run build

      - name: Verify tag version matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "✅ Version verified: $PKG_VERSION"

      - name: Publish to npm via Trusted Publishing (OIDC)
        run: npm publish --access public
        # No NODE_AUTH_TOKEN needed. npm CLI auto-detects the OIDC environment
        # (requires npm >= 11.5.1 and Node >= 22.14.0).
