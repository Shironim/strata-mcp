name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Enables manual "Run workflow" button in GitHub Actions UI

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile


      - name: Run type check
        run: bun run typecheck

      - name: Run test suite
        run: bun test

  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write # Required for OIDC Trusted Publishers
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          # NOTE: Do NOT set registry-url here — it injects NODE_AUTH_TOKEN
          # which conflicts with OIDC authentication

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile


      - name: Build distribution
        run: bun run build

      - name: Verify tag version matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "✅ Version verified: $PKG_VERSION"

      - name: Publish to npm via Trusted Publisher (OIDC)
        run: npm publish --provenance --access public
        # No NPM_TOKEN or NODE_AUTH_TOKEN needed.
        # npm detects the GitHub Actions OIDC environment automatically
        # via id-token: write permission configured above.
